<!DOCTYPE html>
<html lang="en" class="h-full select-none">
<head>
    <script>
    (function () {
        if (sessionStorage.getItem("PLAYCENTRIX_NEXT") !== "2") {
            window.location.replace("index.html");
            return;
        }

        sessionStorage.removeItem("PLAYCENTRIX_NEXT");
    })();
    </script>

    <!-- your existing head code -->

    <meta charset="UTF-8">
    <!-- rest of your existing head -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Playcentrix 3-Step Auth Credentials</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0A0A0C',
                        cardBg: '#1C1C1E',
                        cardBorder: 'rgba(255, 255, 255, 0.08)',
                        appleBlue: '#0A84FF',
                        appleBlueHover: '#0071E3',
                        emeraldSuccess: '#30D158',
                        crimsonError: '#FF453A'
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'SF Pro Display', 'Inter', 'Google Sans', 'Roboto', 'sans-serif'],
                        mono: ['SF Mono', 'Fira Code', 'Roboto Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Strict view height lock to prevent scrolling or accidental double-tap zoom on mobile */
        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
            background-color: #0A0A0C;
            color: #F2F2F7;
            -webkit-tap-highlight-color: transparent;
        }

        /* Glassmorphism subtle background blur */
        .glass-card {
            background: rgba(28, 28, 30, 0.82);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.75),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
        }

        /* Error Shake Animation */
        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: errorShake 0.45s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Custom Reset for Input and Select UI Elements */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        /* Pulsing Glow Effect for Security Badges */
        .glow-blue {
            box-shadow: 0 0 25px -5px rgba(10, 132, 255, 0.35);
        }
        .glow-emerald {
            box-shadow: 0 0 35px -5px rgba(48, 209, 88, 0.45);
        }
        .glow-crimson {
            box-shadow: 0 0 35px -5px rgba(255, 69, 58, 0.45);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative font-sans antialiased text-gray-100">

    <!-- Subtle Background Ambient Light Glow -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none flex items-center justify-center">
        <div id="ambientGlow" class="w-[320px] h-[320px] sm:w-[480px] sm:h-[480px] bg-blue-600/10 rounded-full blur-[130px] transition-all duration-700"></div>
    </div>

    <!-- Main Auth Card -->
    <main id="authCard" class="glass-card w-full max-w-[410px] rounded-3xl border border-white/10 p-6 sm:p-8 relative z-10 transition-all duration-300">
        
        <!-- Header & Branding -->
        <div class="flex flex-col items-center text-center mb-7">
            <!-- Sleek Security Icon Badge -->
            <div id="iconBadge" class="w-14 h-14 rounded-2xl bg-white/[0.04] border border-white/10 flex items-center justify-center mb-4 transition-all duration-300 shadow-inner glow-blue">
                <svg id="lockIcon" class="w-6 h-6 text-appleBlue transition-all duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            
            <div class="inline-flex items-center space-x-1.5 bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/20 mb-2">
                <span class="w-1.5 h-1.5 rounded-full bg-appleBlue animate-pulse"></span>
                <span class="text-[10px] font-semibold tracking-widest text-appleBlue uppercase">3-Step Security Portal</span>
            </div>
            <h1 class="text-xl sm:text-2xl font-semibold tracking-tight text-white">Identity Verification</h1>
            <p class="text-xs text-gray-400 mt-1 font-normal">Enter credential key & select security protocol</p>
        </div>

        <!-- Form Inputs Container -->
        <div class="space-y-4">
            
            <!-- Code Input & Dropdown Integrated Container -->
            <div id="inputGroup" class="relative flex items-center bg-black/50 border border-white/10 rounded-2xl overflow-hidden focus-within:border-appleBlue/70 focus-within:ring-2 focus-within:ring-appleBlue/20 transition-all duration-200">
                
                <!-- Main Code Input Field (Max length 9 for A629HP7GF) -->
                <input 
                    type="text" 
                    id="codeInput" 
                    placeholder="Enter Code" 
                    maxlength="9"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    class="w-2/3 bg-transparent px-4 py-3.5 text-white placeholder-gray-500 font-mono text-base font-semibold uppercase tracking-wider focus:outline-none"
                >

                <!-- Vertical Divider -->
                <div class="h-6 w-[1px] bg-white/10"></div>

                <!-- Protocol Select Dropdown -->
                <div class="relative w-1/3 flex items-center justify-center bg-white/[0.02]">
                    <select id="dropdown" class="w-full bg-transparent py-3.5 pl-3 pr-7 text-xs font-semibold tracking-wider text-gray-300 focus:outline-none cursor-pointer">
                        <option value="FFT" class="bg-[#1C1C1E] text-gray-200">FFT</option>
                        <option value="PLH" class="bg-[#1C1C1E] text-gray-200">PLH</option>
                        <option value="RTY" class="bg-[#1C1C1E] text-gray-200">RTY</option>
                        <option value="QER" class="bg-[#1C1C1E] text-gray-200">QER</option>
                        <option value="CXV" class="bg-[#1C1C1E] text-gray-200">CXV</option>
                        <option value="BHL" class="bg-[#1C1C1E] text-gray-200">BHL</option>
                    </select>
                    <!-- Custom Arrow Icon -->
                    <svg class="w-3.5 h-3.5 text-gray-400 absolute right-2.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </div>
            </div>

            <!-- Step 2: Slide to Verify Component -->
            <div id="sliderContainer" class="relative pt-1">
                <div class="flex justify-between items-center text-[11px] font-medium text-gray-400 mb-1.5 px-1">
                    <span>Secondary Authorization</span>
                    <span id="slideStatusText" class="text-[10px] text-gray-500 font-mono">Slide Required</span>
                </div>

                <div id="sliderTrack" class="relative w-full h-12 bg-black/50 border border-white/10 rounded-2xl overflow-hidden flex items-center p-1 cursor-pointer select-none transition-all duration-200">
                    
                    <!-- Drag Progress Bar Fill -->
                    <div id="sliderFill" class="absolute top-0 left-0 bottom-0 bg-appleBlue/20 w-0 transition-all duration-75"></div>
                    
                    <!-- Track Label -->
                    <span id="sliderLabel" class="absolute inset-0 flex items-center justify-center text-xs font-medium text-gray-400 pointer-events-none transition-opacity duration-200">
                        Slide to authorize step 2
                    </span>

                    <!-- Draggable Thumb Button -->
                    <div id="sliderThumb" class="relative z-10 w-10 h-10 bg-white/10 border border-white/20 rounded-xl flex items-center justify-center shadow-lg transition-transform duration-75 hover:bg-white/15 active:scale-95">
                        <svg id="thumbIcon" class="w-4 h-4 text-white transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Feedback / Error Notification -->
            <div id="feedbackMsg" class="text-center text-xs font-medium text-crimsonError min-h-[16px] transition-all opacity-0">
                Invalid verification code or protocol match
            </div>

            <!-- Primary Action Button -->
            <button 
                id="verifyBtn" 
                onclick="verifyAuth()"
                class="w-full h-12 bg-appleBlue hover:bg-appleBlueHover active:scale-[0.99] text-white font-medium text-sm rounded-2xl shadow-lg shadow-blue-600/20 border border-blue-400/20 flex items-center justify-center space-x-2 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <span id="btnText">Verify Credentials</span>
                
                <!-- Sleek Spinner -->
                <svg id="btnSpinner" class="hidden animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>

                <!-- Success Checkmark -->
                <svg id="btnCheck" class="hidden w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                </svg>
            </button>
        </div>

        <!-- Footer -->
        <div class="mt-6 text-center">
            <span class="text-[10px] text-gray-500 font-mono tracking-wider">PLAYCENTRIX SECURE AUTH v3.2</span>
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        const CORRECT_CODE = "A629HP7GF";
        const CORRECT_DROPDOWN = "CXV";
        const SESSION_TOKEN_KEY = "playcentrix_auth_session";
        const SESSION_TOKEN_VAL = "5678";

        // DOM Elements
        const codeInput = document.getElementById('codeInput');
        const dropdown = document.getElementById('dropdown');
        const authCard = document.getElementById('authCard');
        const inputGroup = document.getElementById('inputGroup');
        const verifyBtn = document.getElementById('verifyBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnCheck = document.getElementById('btnCheck');
        const lockIcon = document.getElementById('lockIcon');
        const iconBadge = document.getElementById('iconBadge');
        const ambientGlow = document.getElementById('ambientGlow');
        const feedbackMsg = document.getElementById('feedbackMsg');

        // Slider Elements
        const sliderTrack = document.getElementById('sliderTrack');
        const sliderThumb = document.getElementById('sliderThumb');
        const sliderFill = document.getElementById('sliderFill');
        const sliderLabel = document.getElementById('sliderLabel');
        const slideStatusText = document.getElementById('slideStatusText');
        const thumbIcon = document.getElementById('thumbIcon');

        // Slider Variables
        let isDragging = false;
        let sliderUnlocked = false;
        let startX = 0;
        let currentX = 0;
        let maxDelta = 0;

        // Auto uppercase logic for security code input
        codeInput.addEventListener('input', () => {
            codeInput.value = codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        });

        function calculateMaxDelta() {
            maxDelta = sliderTrack.clientWidth - sliderThumb.clientWidth - 8;
        }
        window.addEventListener('resize', calculateMaxDelta);
        calculateMaxDelta();

        // Touch and Mouse Drag Logic for Slide-to-Verify
        function onDragStart(e) {
            if (sliderUnlocked) return;
            isDragging = true;
            calculateMaxDelta();
            startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            sliderTrack.classList.add('border-appleBlue/50');
        }

        function onDragMove(e) {
            if (!isDragging || sliderUnlocked) return;
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            let delta = clientX - startX;
            if (delta < 0) delta = 0;
            if (delta > maxDelta) delta = maxDelta;

            currentX = delta;
            sliderThumb.style.transform = `translateX(${delta}px)`;
            sliderFill.style.width = `${delta + 20}px`;
            
            // Smoothly fade out text as slider approaches right end
            sliderLabel.style.opacity = Math.max(0, 1 - (delta / (maxDelta * 0.7)));
        }

        function onDragEnd() {
            if (!isDragging || sliderUnlocked) return;
            isDragging = false;

            // Threshold for success unlock (80% dragged)
            if (currentX >= maxDelta * 0.8) {
                sliderUnlocked = true;
                currentX = maxDelta;
                sliderThumb.style.transform = `translateX(${maxDelta}px)`;
                sliderFill.style.width = '100%';
                
                // Visual updates on successful slide
                sliderTrack.classList.remove('border-white/10', 'border-appleBlue/50');
                sliderTrack.classList.add('border-emeraldSuccess/40', 'bg-emerald-950/20');
                sliderThumb.classList.remove('bg-white/10');
                sliderThumb.classList.add('bg-emeraldSuccess', 'border-emerald-400');
                
                thumbIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>`;
                sliderLabel.textContent = "Step 2 Authorized";
                sliderLabel.classList.remove('text-gray-400');
                sliderLabel.classList.add('text-emeraldSuccess', 'font-semibold');
                sliderLabel.style.opacity = '1';
                slideStatusText.textContent = "Authorized";
                slideStatusText.classList.replace('text-gray-500', 'text-emeraldSuccess');
            } else {
                // Bounce back animation
                sliderThumb.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)';
                sliderFill.style.transition = 'width 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)';
                
                sliderThumb.style.transform = 'translateX(0px)';
                sliderFill.style.width = '0px';
                sliderLabel.style.opacity = '1';
                sliderTrack.classList.remove('border-appleBlue/50');

                setTimeout(() => {
                    sliderThumb.style.transition = 'transform 0.075s';
                    sliderFill.style.transition = 'width 0.075s';
                }, 250);
            }
        }

        // Event listeners for Dragging
        sliderThumb.addEventListener('mousedown', onDragStart);
        sliderThumb.addEventListener('touchstart', onDragStart, { passive: true });

        window.addEventListener('mousemove', onDragMove);
        window.addEventListener('touchmove', onDragMove, { passive: true });

        window.addEventListener('mouseup', onDragEnd);
        window.addEventListener('touchend', onDragEnd);

        function verifyAuth() {
            const userCode = codeInput.value.trim();
            const dropdownValue = dropdown.value;

            // Clear previous errors
            feedbackMsg.classList.add('opacity-0');
            inputGroup.classList.remove('border-crimsonError', 'ring-2', 'ring-crimsonError/20');

            // Input Validation
            if (!userCode) {
                showError("Please enter the 9-character credential key.");
                return;
            }

            if (!sliderUnlocked) {
                showError("Please complete the slide authorization.");
                sliderTrack.classList.add('animate-shake');
                setTimeout(() => sliderTrack.classList.remove('animate-shake'), 500);
                return;
            }

            // Enter Loading State
            verifyBtn.disabled = true;
            btnText.textContent = "Verifying...";
            btnSpinner.classList.remove('hidden');

            // Authentication verification delay for security feel
            setTimeout(() => {
                const isCodeValid = (userCode === CORRECT_CODE);
                const isDropdownValid = (dropdownValue === CORRECT_DROPDOWN);

                if (isCodeValid && isDropdownValid) {
                    // --- SUCCESS PATH ---
                    // Silently store the temporary auth token in local storage before redirecting
                    try {
                        localStorage.setItem(SESSION_TOKEN_KEY, SESSION_TOKEN_VAL);
                    } catch (e) {
                        console.error("Local storage error:", e);
                    }

                    btnSpinner.classList.add('hidden');
                    btnCheck.classList.remove('hidden');
                    btnText.textContent = "Verified";
                    
                    // Style Button as Green
                    verifyBtn.classList.remove('bg-appleBlue', 'hover:bg-appleBlueHover');
                    verifyBtn.classList.add('bg-emeraldSuccess', 'border-emerald-400/30', 'shadow-emerald-600/20');
                    
                    // Header Visual Glow Updates
                    lockIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>`;
                    lockIcon.classList.replace('text-appleBlue', 'text-emeraldSuccess');
                    iconBadge.classList.replace('glow-blue', 'glow-emerald');
                    iconBadge.classList.add('border-emeraldSuccess/30', 'bg-emeraldSuccess/10');

                    // Card ambient lighting shift
                    authCard.classList.add('border-emeraldSuccess/40', 'glow-emerald');
                    ambientGlow.classList.replace('bg-blue-600/10', 'bg-emerald-500/20');

                    // Redirect after 1.5s
                    setTimeout(() => {
                        window.location.href = 'step.html';
                    }, 1500);

                } else {
                    // --- FAILURE PATH ---
                    btnSpinner.classList.add('hidden');
                    verifyBtn.disabled = false;
                    btnText.textContent = "Verify Credentials";

                    showError("Incorrect code or protocol selection.");
                    
                    // Shake animation and Crimson border feedback
                    authCard.classList.add('animate-shake', 'border-crimsonError/50');
                    inputGroup.classList.add('border-crimsonError', 'ring-2', 'ring-crimsonError/20');
                    iconBadge.classList.replace('glow-blue', 'glow-crimson');

                    setTimeout(() => {
                        authCard.classList.remove('animate-shake');
                    }, 500);

                    // Revert error styling after 2 seconds without changing localStorage
                    setTimeout(() => {
                        authCard.classList.remove('border-crimsonError/50');
                        inputGroup.classList.remove('border-crimsonError', 'ring-2', 'ring-crimsonError/20');
                        iconBadge.classList.replace('glow-crimson', 'glow-blue');
                        feedbackMsg.classList.add('opacity-0');
                    }, 2000);
                }
            }, 1200);
        }

        function showError(msg) {
            feedbackMsg.textContent = msg;
            feedbackMsg.classList.remove('opacity-0');
        }
    </script>
</body>
</html>

Place this script at the absolute top of <head> inside your step.html file:

<script>
    (function() {
        const AUTH_KEY = 'playcentrix_auth_session';
        const EXPECTED_CODE = '5678';
        const sessionToken = localStorage.getItem(AUTH_KEY);

        if (sessionToken !== EXPECTED_CODE) {
            // Immediate silent redirect to index.html if user attempts direct URL access
            window.location.replace('index.html');
        } else {
            // Instantly clear the code so it cannot be reused or refreshed
            localStorage.removeItem(AUTH_KEY);
        }
    })();
</script>
