<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Playcentrix | Level 2 Security Protocol</title>

<!-- Immediate Security Gatekeeper (Failsafe before DOM paint) -->
<script>
(function() {
    const sessionToken = localStorage.getItem('playcentrix_auth_session');
    if (sessionToken !== '5678') {
        window.location.replace('index.html');
    } else {
        // Instantly delete single-use token to prevent refresh/direct access
        localStorage.removeItem('playcentrix_auth_session');
    }
})();
</script>

<!-- MediaPipe Face Mesh & Camera CDN Libraries -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

<style>
    :root {
        --bg-color: #050508;
        --card-bg: rgba(18, 18, 26, 0.75);
        --card-border: rgba(255, 255, 255, 0.08);
        --accent-blue: #3b82f6;
        --accent-cyan: #06b6d4;
        --accent-emerald: #10b981;
        --accent-danger: #ef4444;
        --text-primary: #f9fafb;
        --text-secondary: #9ca3af;
        --input-bg: rgba(255, 255, 255, 0.04);
        --input-border: rgba(255, 255, 255, 0.1);
        --font-family: -apple-system, BlinkMacSystemFont, "Google Sans", "SF Pro Display", Roboto, sans-serif;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: var(--font-family);
        -webkit-tap-highlight-color: transparent;
        user-select: none;
    }

    html, body {
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background-color: var(--bg-color);
        color: var(--text-primary);
        display: flex;
        justify-content: center;
        align-items: center;
        touch-action: manipulation;
    }

    /* Ambient Background Glow */
    .ambient-glow {
        position: fixed;
        width: 380px;
        height: 380px;
        background: radial-gradient(circle, rgba(6, 182, 212, 0.12) 0%, rgba(59, 130, 246, 0.08) 50%, transparent 70%);
        filter: blur(60px);
        z-index: 0;
        pointer-events: none;
    }

    /* Glass Container */
    .container {
        position: relative;
        z-index: 1;
        width: 90%;
        max-width: 410px;
        background: var(--card-bg);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border: 1px solid var(--card-border);
        border-radius: 28px;
        padding: 28px 22px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    /* Header Styling */
    .header {
        text-align: center;
    }

    .brand-icon {
        width: 44px;
        height: 44px;
        margin: 0 auto 10px;
        background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 20px rgba(6, 182, 212, 0.3);
    }

    .brand-icon svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: #fff;
        stroke-width: 2;
    }

    .header h1 {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
    }

    .header p {
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin-top: 2px;
    }

    /* Progress Tracker */
    .step-tracker {
        display: flex;
        justify-content: center;
        gap: 8px;
    }

    .step-pill {
        flex: 1;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        transition: all 0.4s ease;
    }

    .step-pill.active {
        background: var(--accent-cyan);
        box-shadow: 0 0 12px rgba(6, 182, 212, 0.6);
    }

    .step-pill.completed {
        background: var(--accent-emerald);
    }

    /* Cards */
    .step-card {
        display: none;
        flex-direction: column;
        gap: 16px;
        animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .step-card.active {
        display: flex;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Input Fields */
    .input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        text-align: left;
    }

    .input-group label {
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.06em;
    }

    input[type="text"], input[type="password"], select {
        width: 100%;
        padding: 14px 16px;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 14px;
        color: #fff;
        font-size: 0.92rem;
        outline: none;
        transition: all 0.25s ease;
    }

    input:focus, select:focus {
        border-color: var(--accent-cyan);
        background: rgba(255, 255, 255, 0.07);
        box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15);
    }

    select {
        cursor: pointer;
        appearance: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
        background-repeat: no-repeat;
        background-position: right 14px center;
    }

    select option {
        background-color: #0f0f15;
        color: #fff;
    }

    /* Action Buttons */
    .btn-action {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
        color: white;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
        box-shadow: 0 4px 15px rgba(6, 182, 212, 0.25);
    }

    .btn-action:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(6, 182, 212, 0.35);
    }

    .shake {
        animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
    }

    .error-msg {
        font-size: 0.78rem;
        color: var(--accent-danger);
        text-align: center;
        min-height: 18px;
    }

    /* ==========================================================
       AI Cyber Face Canvas Viewport (No Camera Video Rendered)
       ========================================================== */
    .mesh-viewport {
        position: relative;
        width: 100%;
        height: 250px;
        background: #08080e;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(6, 182, 212, 0.2);
        box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Hidden Camera Input */
    #webcam {
        display: none !important;
    }

    /* Cyber Canvas */
    #meshCanvas {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* Scanner Grid Line Overlay */
    .scanner-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, rgba(6, 182, 212, 0.05) 0%, transparent 100%);
        pointer-events: none;
    }

    /* Countdown Display */
    .countdown-badge {
        font-size: 1.1rem;
        font-weight: 700;
        text-align: center;
        color: var(--text-primary);
        letter-spacing: -0.01em;
        min-height: 28px;
    }

    .countdown-active {
        color: var(--accent-emerald);
        text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }
</style>
</head>
<body>

<div class="ambient-glow"></div>

<!-- Hidden video element for raw camera stream feed -->
<video id="webcam" playsinline muted></video>

<div class="container" id="mainContainer">
    <div class="header">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <h1>Level 2 Authentication</h1>
        <p>Multi-factor AI Protocol</p>
    </div>

    <!-- Step Indicators -->
    <div class="step-tracker">
        <div class="step-pill active" id="pill1"></div>
        <div class="step-pill" id="pill2"></div>
        <div class="step-pill" id="pill3"></div>
    </div>

    <!-- STEP 1 -->
    <div class="step-card active" id="step1">
        <div class="input-group">
            <label>Security Code</label>
            <input type="text" id="secCode" placeholder="Enter 12-digit code" maxlength="12" autocomplete="off">
        </div>

        <div class="input-group">
            <label>Security Key</label>
            <input type="text" id="secKey" placeholder="e.g. PX-XXXX-X" autocomplete="off">
        </div>

        <div class="input-group">
            <label>Protocol Version</label>
            <select id="secProtocol">
                <option value="DELTA_V1">DELTA_V1</option>
                <option value="OMEGA_V2">OMEGA_V2</option>
                <option value="SIGMA_V4">SIGMA_V4</option>
                <option value="KAPPA_V9">KAPPA_V9</option>
            </select>
        </div>

        <div class="error-msg" id="errStep1"></div>
        <button class="btn-action" onclick="verifyStep1()">Continue to Phase 2 →</button>
    </div>

    <!-- STEP 2 -->
    <div class="step-card" id="step2">
        <div class="input-group">
            <label>Secondary PIN</label>
            <input type="password" id="secPin" placeholder="4-digit PIN" maxlength="4" inputmode="numeric">
        </div>

        <div class="input-group">
            <label>Entropy Key</label>
            <select id="secEntropy">
                <option value="0x1B4C">0x1B4C</option>
                <option value="0x8F2A">0x8F2A</option>
                <option value="0x3E9D">0x3E9D</option>
                <option value="0x7C0F">0x7C0F</option>
            </select>
        </div>

        <div class="error-msg" id="errStep2"></div>
        <button class="btn-action" onclick="verifyStep2()">Proceed to AI Biometric Mesh →</button>
    </div>

    <!-- STEP 3: MediaPipe AI Wireframe Face Verification (NO Video Preview) -->
    <div class="step-card" id="step3">
        <p style="font-size: 0.8rem; color: var(--text-secondary); text-align: center;">
            Position your face. Wireframe mesh will render automatically.
        </p>

        <div class="mesh-viewport">
            <canvas id="meshCanvas"></canvas>
            <div class="scanner-overlay"></div>
        </div>

        <div class="countdown-badge" id="countdownStatus">Awaiting Face Detection...</div>
        <div class="error-msg" id="errStep3"></div>
    </div>
</div>

<script>
// Valid Test Credentials
const CORRECT_CODE = "894271053391";
const CORRECT_KEY = "PX-9920-X";
const CORRECT_PROTOCOL = "SIGMA_V4";
const CORRECT_PIN = "9482";
const CORRECT_ENTROPY = "0x8F2A";

// Elements
const container = document.getElementById('mainContainer');
const step1 = document.getElementById('step1');
const step2 = document.getElementById('step2');
const step3 = document.getElementById('step3');

const pill1 = document.getElementById('pill1');
const pill2 = document.getElementById('pill2');
const pill3 = document.getElementById('pill3');

// Auto Upper Case
document.getElementById('secKey').addEventListener('input', (e) => {
    e.target.value = e.target.value.toUpperCase();
});

// Step 1 Verification
function verifyStep1() {
    const code = document.getElementById('secCode').value.trim();
    const key = document.getElementById('secKey').value.trim().toUpperCase();
    const protocol = document.getElementById('secProtocol').value;
    const err = document.getElementById('errStep1');

    if (code === CORRECT_CODE && key === CORRECT_KEY && protocol === CORRECT_PROTOCOL) {
        err.textContent = "";
        step1.classList.remove('active');
        step2.classList.add('active');
        pill1.classList.remove('active');
        pill1.classList.add('completed');
        pill2.classList.add('active');
    } else {
        triggerError(err, "Invalid credentials or protocol mismatch.");
    }
}

// Step 2 Verification
function verifyStep2() {
    const pin = document.getElementById('secPin').value.trim();
    const entropy = document.getElementById('secEntropy').value;
    const err = document.getElementById('errStep2');

    if (pin === CORRECT_PIN && entropy === CORRECT_ENTROPY) {
        err.textContent = "";
        step2.classList.remove('active');
        step3.classList.add('active');
        pill2.classList.remove('active');
        pill2.classList.add('completed');
        pill3.classList.add('active');
        
        // Start MediaPipe Cybernetic Face Mesh Scan
        initFaceMeshScan();
    } else {
        triggerError(err, "Secondary parameters rejected.");
    }
}

function triggerError(element, msg) {
    element.textContent = msg;
    container.classList.add('shake');
    setTimeout(() => container.classList.remove('shake'), 400);
}

/* ==============================================================
   MediaPipe Cybernetic Face Mesh & Countdown Controller
   ============================================================== */
let faceHoldStartTime = null;
const HOLD_REQUIRED_SEC = 3;
let isCompleted = false;
let scanLineY = 0;
let scanDirection = 1;

function initFaceMeshScan() {
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('meshCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const countdownStatus = document.getElementById('countdownStatus');

    // Resize canvas properly
    function resizeCanvas() {
        canvasElement.width = canvasElement.clientWidth * window.devicePixelRatio;
        canvasElement.height = canvasElement.clientHeight * window.devicePixelRatio;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Initialize MediaPipe FaceMesh
    const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
        if (isCompleted) return;

        const width = canvasElement.width;
        const height = canvasElement.height;

        // Clear Canvas (Render Dark Obsidian Cyber Grid)
        canvasCtx.clearRect(0, 0, width, height);
        canvasCtx.fillStyle = '#08080e';
        canvasCtx.fillRect(0, 0, width, height);

        // Draw animated scanning line
        scanLineY += 2 * scanDirection;
        if (scanLineY > height || scanLineY < 0) scanDirection *= -1;

        canvasCtx.strokeStyle = 'rgba(6, 182, 212, 0.25)';
        canvasCtx.lineWidth = 1.5;
        canvasCtx.beginPath();
        canvasCtx.moveTo(0, scanLineY);
        canvasCtx.lineTo(width, scanLineY);
        canvasCtx.stroke();

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            const landmarks = results.multiFaceLandmarks[0];

            // Render Cybernetic Mesh Points & Structural Wireframe
            canvasCtx.fillStyle = '#06b6d4';
            canvasCtx.strokeStyle = 'rgba(6, 182, 212, 0.35)';
            canvasCtx.lineWidth = 1;

            // Draw Landmark Mesh Nodes
            for (let i = 0; i < landmarks.length; i += 3) {
                const pt = landmarks[i];
                // Mirror horizontally for natural orientation
                const x = (1 - pt.x) * width;
                const y = pt.y * height;

                canvasCtx.beginPath();
                canvasCtx.arc(x, y, 1.5, 0, 2 * Math.PI);
                canvasCtx.fill();
            }

            // Draw Key Structural Contours (Oval, Eyes, Mouth)
            drawContour(canvasCtx, landmarks, [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109], width, height);
            drawContour(canvasCtx, landmarks, [33, 7, 163, 144, 145, 153, 154, 155, 133], width, height); // Left eye
            drawContour(canvasCtx, landmarks, [263, 249, 390, 373, 374, 380, 381, 382, 362], width, height); // Right eye

            // Countdown Logic
            if (!faceHoldStartTime) {
                faceHoldStartTime = Date.now();
            }

            const elapsedSec = (Date.now() - faceHoldStartTime) / 1000;
            const remaining = Math.max(0, Math.ceil(HOLD_REQUIRED_SEC - elapsedSec));

            countdownStatus.className = "countdown-badge countdown-active";
            countdownStatus.textContent = `Keep face in frame: ${remaining}...`;

            if (elapsedSec >= HOLD_REQUIRED_SEC) {
                isCompleted = true;
                countdownStatus.textContent = "Identity Confirmed ✓";

                // Generate Temporary Code 6776 in LocalStorage (30s TTL)
                const mainSession = {
                    code: '6776',
                    expiresAt: Date.now() + 30000
                };
                localStorage.setItem('playcentrix_main_session', JSON.stringify(mainSession));

                setTimeout(() => {
                    window.location.href = 'main.html';
                }, 800);
            }
        } else {
            // Face lost - reset timer
            faceHoldStartTime = null;
            countdownStatus.className = "countdown-badge";
            countdownStatus.textContent = "Position Face in Frame";

            // Render Radar Radar Pulse when searching
            canvasCtx.fillStyle = 'rgba(156, 163, 175, 0.15)';
            canvasCtx.font = '12px var(--font-family)';
            canvasCtx.textAlign = 'center';
            canvasCtx.fillText('AI MESH ACTIVE - SEARCHING...', width / 2, height / 2);
        }
    });

    // Start Webcam silently in background
    const camera = new Camera(videoElement, {
        onFrame: async () => {
            await faceMesh.send({ image: videoElement });
        },
        width: 640,
        height: 480
    });

    camera.start().catch((err) => {
        console.warn("Camera access denied or unmounted, running simulated scan fallback.", err);
        // Fallback simulation if device camera permissions are blocked
        let count = 3;
        const interval = setInterval(() => {
            countdownStatus.className = "countdown-badge countdown-active";
            countdownStatus.textContent = `Keep face in frame: ${count}...`;
            count--;
            if (count < 0) {
                clearInterval(interval);
                countdownStatus.textContent = "Identity Confirmed ✓";
                localStorage.setItem('playcentrix_main_session', JSON.stringify({
                    code: '6776',
                    expiresAt: Date.now() + 30000
                }));
                setTimeout(() => { window.location.href = 'main.html'; }, 800);
            }
        }, 1000);
    });
}

function drawContour(ctx, landmarks, indices, width, height) {
    ctx.beginPath();
    for (let i = 0; i < indices.length; i++) {
        const pt = landmarks[indices[i]];
        const x = (1 - pt.x) * width;
        const y = pt.y * height;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
}
</script>
</body>
</html>
